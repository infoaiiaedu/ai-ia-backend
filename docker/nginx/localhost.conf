# Localhost development configuration
# This allows direct access via localhost:8080 without subdomain routing

# Default server - handles localhost and undefined hosts
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100M;
    
    # Static files (must come before proxy)
    location /static/ {
        alias /app/storage/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/storage/media/;
        access_log off;
        expires 30d;
    }
    
    # Health check endpoint
    location = / {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
    
    # Proxy all other requests to Django
    location / {
        proxy_pass http://app:5000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_connect_timeout 400;
        proxy_send_timeout 400;
        proxy_read_timeout 400;
        send_timeout 400;
    }
}

# API Subdomain - serves Django API docs
server {
    listen 80;
    server_name api.eduaiia.com;
    client_max_body_size 100M;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static files
    location /static/ {
        alias /app/storage/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/storage/media/;
        access_log off;
        expires 30d;
    }

    # API routes only
    location /api/ {
        limit_req zone=api burst=500 nodelay;
        limit_conn conn_limit 150;

        add_header Content-Security-Policy "frame-ancestors *";

        proxy_pass http://app:5000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;

        proxy_connect_timeout 400;
        proxy_send_timeout 400;
        proxy_read_timeout 400;
        send_timeout 400;
    }

    # Redirect root to API docs
    location = / {
        return 301 /api/docs/;
    }

    # Block all other routes
    location / {
        return 404;
    }
}

