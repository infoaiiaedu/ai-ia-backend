services:
  app:
    image: ghcr.io/infoaiiaedu/ai-ia-backend:${IMAGE_TAG:-latest}
    container_name: django_backend
    restart: always
    command: >
      /bin/sh -c "
      echo 'Waiting for Postgres...' &&
      until pg_isready -h psql -U postgres; do
        sleep 2
      done &&
      echo 'Postgres is ready!' &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn main.wsgi:application --bind 0.0.0.0:5000 --workers 2 --threads 2 --log-level info
      "
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ../../storage:/app/storage
      - ../../config:/app/config:ro
    depends_on:
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
    environment:
      - PYTHONPATH=/app/code
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7.2-alpine
    container_name: django_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  psql:
    image: postgres:16-alpine
    container_name: django_psql
    restart: always
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../../storage/db/pgdata:/var/lib/postgresql/data
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.25-alpine
    container_name: django_nginx
    restart: always
    ports:
      - "8080:80"    # Use port 8080 to avoid conflict with PM2
      - "8443:443"   # Use port 8443 for HTTPS
    volumes:
      - ../../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../docker/nginx/subdomain.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../storage:/app/storage:ro
      - ../../storage/certbot/conf:/etc/letsencrypt:ro
      - ../../storage/certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis-data:

networks:
  backend_network:
    driver: bridge