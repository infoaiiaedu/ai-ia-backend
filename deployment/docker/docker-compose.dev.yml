services:
  app:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: main:1.0
    container_name: django_backend_dev
    restart: always
    command: >
      /bin/sh -c "
      echo 'Waiting for Postgres...' &&
      until pg_isready -h psql -U postgres; do
        sleep 2
      done &&
      echo 'Postgres is ready!' &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      echo 'Starting development server...' &&
      exec python manage.py runserver 0.0.0.0:5000
      "
    ports:
      - "5000:5000"  # Expose Django directly for local development
    volumes:
      - ../../code:/app/code
      - ../../storage:/app/storage
      - ../../config:/app/config:ro
    depends_on:
      psql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
    environment:
      - PYTHONPATH=/app/code
      - DEBUG=True
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7.2-alpine
    container_name: django_redis_dev
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"  # Expose Redis for local access
    volumes:
      - redis-data:/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  psql:
    image: postgres:16-alpine
    container_name: django_psql_dev
    restart: always
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"  # Expose PostgreSQL for local access
    volumes:
      - ../../storage/db/pgdata:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  redis-data:

networks:
  backend_network:
    driver: bridge