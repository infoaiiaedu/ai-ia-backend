# Default server block to handle direct IP access and undefined hostnames
# This prevents access via IP address and protects against host header attacks

# HTTP - Block direct IP access
server {
    listen 80 default_server;
    server_name _;
    
    # Return 444 (nginx special: close connection without response)
    return 444;
}

# HTTPS - Block direct IP access
server {
    listen 443 ssl default_server;
    server_name _;
    
    # Use the same SSL certificate (required for HTTPS to work)
    ssl_certificate /etc/ssl/certs/eduaiia.com.pem;
    ssl_certificate_key /etc/ssl/private/eduaiia.com.key;
    
    # Minimal SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Return 444 (close connection)
    return 444;
}

# HTTP - Allow both HTTP and HTTPS for Cloudflare
server {
    listen 80;
    server_name eduaiia.com www.eduaiia.com;
    
    # Main proxy to Next.js app
        limit_req zone=frontend burst=100 nodelay;
        limit_conn conn_limit 50;
    location / {
        limit_req zone=frontend burst=100 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://aiia_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Cloudflare timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://aiia_frontend/api/health;
        access_log off;
    }
    
    # API health check
    location /api/health {
        proxy_pass http://aiia_frontend/api/health;
        access_log off;
    }
}

# API Subdomain - HTTP
server {
    listen 80;
    server_name api.eduaiia.com;
    
    # Proxy to Django backend
        limit_req zone=api_proxy burst=200 nodelay;
        limit_conn conn_limit 100;
    location / {
        limit_req zone=api_proxy burst=200 nodelay;
        limit_conn conn_limit 100;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # CORS headers for API access
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
}

