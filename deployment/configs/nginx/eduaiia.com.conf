# HTTPS - Main application
server {
    listen 443 ssl;
    server_name eduaiia.com www.eduaiia.com;
    
    # SSL Configuration with Cloudflare Origin Certificate
    ssl_certificate /etc/ssl/certs/eduaiia.com.pem;
    ssl_certificate_key /etc/ssl/private/eduaiia.com.key;
    
    # SSL Settings optimized for Cloudflare
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    
    # Main proxy to Next.js app
        limit_req zone=frontend burst=100 nodelay;
        limit_conn conn_limit 50;
    location / {
        limit_req zone=frontend burst=100 nodelay;
        limit_conn conn_limit 50;
