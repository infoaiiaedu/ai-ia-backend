name: Deploy Backend

on:
  push:
    branches: [ main, test ]

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: ai-ia
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/ai-ia-backend
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            docker compose -f deployment/docker/docker-compose.subdomain.yml down || true
            docker compose -f deployment/docker/docker-compose.subdomain.yml up -d --build
            sleep 5
            curl -fsS http://127.0.0.1:8080/ -o /dev/null
